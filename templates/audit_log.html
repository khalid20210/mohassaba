      <thead>
        <tr class="u_7655465c50">
          <th class="u_f57cf623d1">التاريخ والوقت</th>
          <th class="u_f57cf623d1">المستخدم</th>
          <th class="u_f57cf623d1">الدور</th>
          <th class="u_f57cf623d1">الحدث</th>
          <th class="u_f57cf623d1">النوع</th>
          <th class="u_f57cf623d1">التفاصيل</th>

<script>
let currentPage = 1;
let allLogs = [];

const ACTION_LABELS = {
  login:        'تسجيل دخول',
  login_failed: 'دخول فاشل',
  logout:       'خروج',
  pos_sale:     'بيع POS',
  create:       'إنشاء',
  update:       'تعديل',
  delete:       'حذف',
};

function escHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function badgeClass(action) {
  return 'log-badge badge-' + (document.querySelector('.badge-' + action) ? action : 'default');
}

function formatDate(dt) {
  if (!dt) return '—';
  return dt.replace('T', ' ').slice(0, 16);
}

function renderStats(logs) {
  const counts = {};
  logs.forEach(l => { counts[l.action] = (counts[l.action] || 0) + 1; });
  const statsEl = document.getElementById('statsRow');
  statsEl.innerHTML = Object.entries(counts).slice(0,6).map(([k,v]) => {
    const cls = ['login','login_failed','pos_sale','logout'].includes(k) ? `stats-chip-${k}` : 'stats-chip-default';
    return `<div class="stats-chip ${cls}">
      ${escHtml(ACTION_LABELS[k]||k)}: ${escHtml(v)}
    </div>`;
  }).join('');
}

function loadLogs(page = 1) {
  currentPage = page;
  const action = document.getElementById('filterAction').value;
  const user   = document.getElementById('filterUser').value;
  const from   = document.getElementById('filterFrom').value;
  const to     = document.getElementById('filterTo').value;

  const params = new URLSearchParams({ page, action, user, from, to });

  fetch('/api/v1/audit-log?' + params)
    .then(r => r.json())
    .then(data => {
      allLogs = data.logs || [];
      renderTable(allLogs);
      renderStats(allLogs);
      document.getElementById('logCount').textContent = `${data.total.toLocaleString('ar')} سجل`;
      renderPagination(data.page, data.pages);
    })
    .catch(() => {
      document.getElementById('logsBody').innerHTML =
        '<tr><td colspan="7" class="u_96672e1a00">حدث خطأ أثناء التحميل</td></tr>';
    });
}

function renderTable(logs) {
  const tbody = document.getElementById('logsBody');
  if (!logs.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="u_ebeb0ed2e0">لا توجد سجلات</td></tr>';
    return;
  }
  tbody.innerHTML = logs.map(l => {
    let details = '';
    if (l.new_value) {
      try {
        const obj = JSON.parse(l.new_value);
        details = Object.entries(obj).slice(0,3).map(([k,v]) => `<span class="u_db12fa5528">${escHtml(k)}:</span> ${escHtml(v)}`).join(' &nbsp;|&nbsp; ');
      } catch { details = escHtml(String(l.new_value).slice(0,80)); }
    }
    const badgeCls = 'log-badge badge-' + (ACTION_LABELS[l.action] ? l.action : 'default');
    return `<tr>
      <td class="u_bddd422a9f">${escHtml(formatDate(l.created_at))}</td>
      <td class="u_51d087d2a9">${escHtml(l.actor_name || '—')}</td>
      <td class="u_82f3e411d8">${escHtml(l.actor_role || '—')}</td>
      <td class="u_142a3ab8b1"><span class="${badgeCls}">${escHtml(ACTION_LABELS[l.action]||l.action)}</span></td>
      <td class="u_82f3e411d8">${escHtml(l.entity_type || '—')} ${l.entity_id ? '#'+escHtml(l.entity_id) : ''}</td>
      <td class="u_5be0c4f24e">${details}</td>
      <td class="u_d4ec887aa3">${escHtml(l.ip_address || '—')}</td>
    </tr>`;
  }).join('');
}

function renderPagination(page, pages) {
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let btns = '';
  for (let i = 1; i <= Math.min(pages, 10); i++) {
    const cls = i === page ? 'audit-page-btn audit-page-btn-active' : 'audit-page-btn';
    btns += `<button onclick="loadLogs(${i})" class="${cls}">${i}</button>`;
  }
  el.innerHTML = btns;
}

function clearFilters() {
  document.getElementById('filterAction').value = '';
  document.getElementById('filterUser').value   = '';
  document.getElementById('filterFrom').value   = '';
  document.getElementById('filterTo').value     = '';
  loadLogs(1);
}

function exportCSV() {
  if (!allLogs.length) return alert('لا توجد بيانات للتصدير');
  const headers = ['التاريخ','المستخدم','الدور','الحدث','النوع','التفاصيل','IP'];
  const rows = allLogs.map(l => [
    l.created_at, l.actor_name, l.actor_role, l.action,
    (l.entity_type||'') + (l.entity_id?' #'+l.entity_id:''),
    (l.new_value||'').replace(/[\n\r,]/g,' ').slice(0,200),
    l.ip_address
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${c||''}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `audit_log_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

document.addEventListener('DOMContentLoaded', () => loadLogs(1));
</script>
