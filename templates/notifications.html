{% extends "base.html" %}
{% block title %}الإشعارات{% endblock %}

{% block content %}
<div class="container u_51f5b20528">
  <div class="u_07cb600052">
    <div>
      <h1 class="u_21f1d540ce">الإشعارات</h1>
      <p class="u_25e3e8beea">تنبيهات الحوكمة: الموافقات، التنفيذ، وتحديث السياسات.</p>
    </div>
    <button id="markAllBtn" class="u_69dc6ba753">تمييز الكل كمقروء</button>
  </div>

  <div id="notifMeta" class="u_8b7a1514ae"></div>
  <div id="notifList" class="u_fe3fb0d0fc"></div>
</div>

<script>
async function loadNotifications() {
  const res = await fetch('/api/v1/notifications?limit=100');
  const data = await res.json();
  const list = document.getElementById('notifList');
  const meta = document.getElementById('notifMeta');
  const items = data.items || [];
  meta.textContent = `غير المقروء: ${data.unread_count || 0}`;
  if (!items.length) {
    list.innerHTML = '<div class="u_657129fbc6">لا توجد إشعارات بعد.</div>';
    return;
  }
  list.innerHTML = items.map(item => `
    <article class="notif-item-card ${item.is_read ? '' : 'notif-item-unread'}">
      <div class="u_02ceb4e271">
        <div>
          <div class="u_ef3494ed54">${item.title}</div>
          <div class="u_bb6cb0c377">${item.message}</div>
          <div class="u_0d54e2b9c7">${item.type} • ${item.created_at}</div>
        </div>
        ${item.is_read ? '<span class="u_e6630c11af">مقروء</span>' : `<button data-id="${item.id}" class="read-btn u_6c7574e4cd">قراءة</button>`}
      </div>
    </article>
  `).join('');
  document.querySelectorAll('.read-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      await fetch(`/api/v1/notifications/${id}/read`, {method:'POST'});
      loadNotifications();
    });
  });
}

document.getElementById('markAllBtn').addEventListener('click', async () => {
  await fetch('/api/v1/notifications/read-all', {method:'POST'});
  loadNotifications();
});

loadNotifications();
</script>
{% endblock %}
